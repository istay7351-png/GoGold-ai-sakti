<h1>BRO AI V2 - PRO JALAN!</h1>
<p id="harga">Loading...</p>
<input id="k" type="password" placeholder="Paste Key Baru lu disini" style="padding:10px;width:80%">
<button onclick="s()" style="padding:10px;background:blue;color:white">SIMPAN KEY</button>
<p id="status">Paste Key Baru lu disini, bukan di chat!</p>
<script>
function s(){localStorage.setItem('K',document.getElementById('k').value);alert('Kesimpen!');load();}
async function load(){let key=localStorage.getItem('K');if(!key)return;document.getElementById('k').value=key;
let r=await fetch('https://www.goldapi.io/api/XAU/USD',{headers:{'x-access-token':key}});let d=await r.json();
if(d.price){document.getElementById('harga').innerText='HARGA PRO: $'+d.price;document.getElementById('status').innerText='✅ PRO TERHUBUNG!';}}
load();
</script>
