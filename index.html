<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BRO AI V2</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>body{background:#131722;color:#fff;font-family:Arial;margin:0}.top{padding:12px;background:#131722;border-bottom:1px solid #333}.top b{font-size:15px}#chart{height:55vh}.box{padding:12px;background:#1a1a1a}.bar{padding:14px;text-align:center;background:#ffab00;color:#000;font-weight:bold;font-size:18px}.card{background:#222;padding:12px;margin:8px;border-radius:10px}</style>
</head><body>
<div class="top"><b>OANDA : XAUUSD Gold Spot - BRO AI V2</b> <span style="background:#2962ff;padding:3px 8px;border-radius:6px">M5</span></div>
<div id="chart"></div>
<div class="bar">STATUS: CHART JALAN - TradingView Style</div>
<div class="box"><div class="card">AI TENGAH - Garis Putih</div><div class="card">LIQ BUY - Garis Ijo</div><div class="card">LIQ SELL - Garis Merah</div><div class="card">MA20 Kuning - MA50 Biru</div></div>
<script>
const chart=LightweightCharts.createChart(document.getElementById('chart'),{layout:{background:{color:'#131722'},textColor:'#d1d4dc'},grid:{vertLines:{color:'#1e222d'},horzLines:{color:'#1e222d'}}});
const candle=chart.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350'});
const ma20=chart.addLineSeries({color:'#FFD700'}),ma50=chart.addLineSeries({color:'#2962ff'});
candle.createPriceLine({price:3918,color:'#fff',lineWidth:2,lineStyle:2,title:'AI'});
candle.createPriceLine({price:3852,color:'#00e676',lineWidth:2,lineStyle:2,title:'LIQ BUY'});
candle.createPriceLine({price:4000,color:'#ff5252',lineWidth:2,lineStyle:2,title:'LIQ SELL'});
let data=[],p=3888,now=Math.floor(Date.now()/1000);
for(let i=60;i>=0;i--){let t=now-i*300,o=p,c=o+(Math.random()-0.5)*8;data.push({time:t,open:o,high:Math.max(o,c)+2,low:Math.min(o,c)-2,close:c});p=c;}
candle.setData(data);
</script></body></html>
